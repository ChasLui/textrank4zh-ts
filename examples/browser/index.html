<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextRank4ZH-TS 浏览器演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .demo-section {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .demo-section h2 {
            color: #34495e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }
        
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.15s ease-in-out;
        }
        
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.15s ease-in-out;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .config-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .config-item {
            flex: 1;
            min-width: 200px;
        }
        
        .config-item label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #6c757d;
        }
        
        input[type="number"], select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .results {
            margin-top: 20px;
        }
        
        .result-section {
            margin-bottom: 25px;
        }
        
        .result-section h3 {
            color: #495057;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .keyword-item {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            border: 1px solid #bbdefb;
        }
        
        .sentence-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #28a745;
        }
        
        .sentence-meta {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #6c757d;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            display: block;
        }
        
        .stat-label {
            font-size: 12px;
            color: #6c757d;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TextRank4ZH-TS 浏览器演示</h1>
            <p>基于 TextRank 算法的中文文本关键词提取和摘要生成</p>
        </div>

        <!-- 文本输入 -->
        <div class="demo-section">
            <h2>📝 输入文本</h2>
            <div class="input-group">
                <label for="inputText">请输入要分析的中文文本：</label>
                <textarea 
                    id="inputText" 
                    placeholder="请输入中文文本，例如：北京是中华人民共和国的首都，是全国政治中心、文化中心。上海是中华人民共和国直辖市，是中国最大的经济中心。深圳是中国改革开放的前沿城市，经济发展迅速。"
                ></textarea>
            </div>
            
            <div class="controls">
                <button onclick="loadSampleText()">📋 加载示例文本</button>
                <button onclick="clearText()">🗑️ 清空</button>
                <button onclick="analyzeText()" id="analyzeBtn">🔍 开始分析</button>
            </div>
        </div>

        <!-- 配置面板 -->
        <div class="demo-section">
            <h2>⚙️ 分析配置</h2>
            <div class="config-panel">
                <div class="config-item">
                    <label for="keywordNum">关键词数量</label>
                    <input type="number" id="keywordNum" min="1" max="50" value="10">
                </div>
                <div class="config-item">
                    <label for="sentenceNum">摘要句子数量</label>
                    <input type="number" id="sentenceNum" min="1" max="20" value="3">
                </div>
                <div class="config-item">
                    <label for="windowSize">滑动窗口大小</label>
                    <input type="number" id="windowSize" min="2" max="10" value="2">
                </div>
                <div class="config-item">
                    <label for="minWordLen">最小词长</label>
                    <input type="number" id="minWordLen" min="1" max="5" value="1">
                </div>
            </div>
        </div>

        <!-- 分析结果 -->
        <div id="results" class="results" style="display: none;">
            <!-- 基础统计 -->
            <div class="demo-section">
                <h2>📊 文本统计</h2>
                <div class="stats" id="textStats">
                    <!-- 统计数据将在这里显示 -->
                </div>
            </div>

            <!-- 关键词提取结果 -->
            <div class="demo-section">
                <h2>🏷️ 关键词提取</h2>
                <div class="result-section">
                    <h3>关键词 (按重要性排序)</h3>
                    <div id="keywordsList" class="keyword-list">
                        <!-- 关键词将在这里显示 -->
                    </div>
                </div>
                <div class="result-section">
                    <h3>关键短语</h3>
                    <div id="keyphrasesList" class="keyword-list">
                        <!-- 关键短语将在这里显示 -->
                    </div>
                </div>
            </div>

            <!-- 文本摘要结果 -->
            <div class="demo-section">
                <h2>📄 文本摘要</h2>
                <div class="result-section">
                    <h3>重要句子 (按重要性排序)</h3>
                    <div id="sentencesList">
                        <!-- 重要句子将在这里显示 -->
                    </div>
                </div>
                <div class="result-section">
                    <h3>生成的摘要</h3>
                    <div id="summaryText" style="background: #f8f9fa; padding: 15px; border-radius: 6px; border-left: 4px solid #007bff; font-size: 15px; line-height: 1.6;">
                        <!-- 摘要文本将在这里显示 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="loading" style="display: none;">
            <p>正在分析文本，请稍候...</p>
        </div>

        <!-- 错误信息 -->
        <div id="error" class="error" style="display: none;">
            <!-- 错误信息将在这里显示 -->
        </div>
    </div>

    <script type="module" src="./demo.js"></script>
</body>
</html>
