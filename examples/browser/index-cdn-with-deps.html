<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextRank4ZH-TS 浏览器演示 (CDN+依赖)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .demo-section {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .demo-section h2 {
            color: #34495e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }
        
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.15s ease-in-out;
        }
        
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.15s ease-in-out;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .status {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .result {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            min-height: 150px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TextRank4ZH-TS 浏览器演示 (CDN+依赖)</h1>
            <p>通过CDN加载依赖库后使用TextRank4ZH-TS</p>
        </div>

        <div class="demo-section">
            <h2>🔧 库加载状态</h2>
            <div class="status" id="status">
                <strong>状态:</strong> <span id="statusText">正在加载库...</span>
            </div>
        </div>

        <div class="demo-section">
            <h2>📝 文本输入</h2>
            <div class="input-group">
                <label for="inputText">请输入要分析的中文文本：</label>
                <textarea 
                    id="inputText" 
                    placeholder="请输入中文文本，例如：北京是中华人民共和国的首都，是全国政治中心、文化中心。上海是中华人民共和国直辖市，是中国最大的经济中心。深圳是中国改革开放的前沿城市，经济发展迅速。"
                >北京是中华人民共和国的首都，是全国政治中心、文化中心。上海是中华人民共和国直辖市，是中国最大的经济中心。深圳是中国改革开放的前沿城市，经济发展迅速。广州是广东省省会，是华南地区的经济中心。杭州是浙江省省会，以风景秀丽著称。</textarea>
            </div>
            
            <div class="controls">
                <button onclick="analyzeText()" id="analyzeBtn">🔍 开始分析</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>📊 分析结果</h2>
            <div id="results" class="result">点击上面的按钮开始分析...</div>
        </div>
    </div>

    <!-- 先加载 typescript-result 依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/typescript-result@3.5.2/dist/index.umd.js"></script>
    
    <!-- 加载我们的 IIFE 版本 -->
    <script>
        // 提供 typescriptResult 全局变量
        window.typescriptResult = window.TypescriptResult || window.Result || {
            Ok: (value) => ({ isOk: () => true, value, error: null }),
            Err: (error) => ({ isOk: () => false, value: null, error })
        };
    </script>
    
    <!-- 从本地加载 IIFE 版本进行测试 -->
    <script src="../../dist/index.iife.js"></script>
    
    <script>
        // 检查加载状态
        function updateStatus() {
            const statusText = document.getElementById('statusText');
            
            if (typeof window.typescriptResult === 'undefined') {
                statusText.innerHTML = '❌ typescript-result 依赖未加载';
                return false;
            }
            
            if (typeof window.TextRank4ZH === 'undefined') {
                statusText.innerHTML = '❌ TextRank4ZH 库未加载';
                return false;
            }
            
            statusText.innerHTML = '✅ 所有库已成功加载';
            return true;
        }

        // 分析文本
        function analyzeText() {
            if (!updateStatus()) {
                return;
            }
            
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                document.getElementById('results').textContent = '❌ 请输入文本内容';
                return;
            }

            document.getElementById('results').textContent = '🔄 正在分析...';

            try {
                const { TextRankKeyword, TextRankSentence } = window.TextRank4ZH;
                
                // 关键词分析
                const tr4w = new TextRankKeyword();
                const result = tr4w.analyze(text, {
                    window: 2,
                    lower: true,
                    vertexSource: 'all_filters'
                });
                
                if (!result.ok) {
                    throw new Error('关键词分析失败: ' + result.error.message);
                }
                
                const keywords = tr4w.getKeywords(10, 1);
                
                // 句子分析
                const tr4s = new TextRankSentence();
                tr4s.analyze(text, {
                    lower: true,
                    source: 'no_stop_words'
                });
                
                const sentences = tr4s.getKeySentences(3);
                const summary = tr4s.getSummary(3, 10, true);

                const resultText = `🔑 关键词分析结果:

关键词 (${keywords.length}):
${keywords.map((k, i) => `${i+1}. ${k.word} (权重: ${k.weight.toFixed(4)})`).join('\n')}

📄 句子分析结果:

关键句子 (${sentences.length}):
${sentences.map((s, i) => `${i+1}. [${s.index}] ${s.sentence} (权重: ${s.weight.toFixed(4)})`).join('\n\n')}

文本摘要:
${summary}

✅ 分析完成！库加载状态正常。`;

                document.getElementById('results').textContent = resultText;

            } catch (error) {
                document.getElementById('results').textContent = `❌ 分析失败: ${error.message}`;
                console.error('分析失败:', error);
            }
        }

        // 页面加载完成后检查状态
        window.addEventListener('load', () => {
            setTimeout(updateStatus, 100);
        });

        console.log('🚀 页面已加载');
        console.log('typescript-result:', typeof window.typescriptResult);
        console.log('TextRank4ZH:', typeof window.TextRank4ZH);
    </script>
</body>
</html>
