codecov:
  # 覆盖率报告配置
  require_ci_to_pass: true
  notify:
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        if_no_uploads: error
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 1%

# 忽略的文件和目录
ignore:
  - "tests/**"           # 测试文件
  - "examples/**"        # 示例文件
  - "dist/**"           # 构建产物
  - "*.config.*"        # 配置文件
  - "build.config.ts"   # 构建配置
  - "vitest.config.ts"  # 测试配置
  - ".github/**"        # GitHub配置
  - "*.md"              # 文档文件

# 标记配置
flags:
  unittests:
    paths:
      - src/

# 评论配置
comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# GitHub集成
github_checks:
  annotations: true